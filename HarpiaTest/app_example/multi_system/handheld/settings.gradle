// handheld -- the reference system's Java program (multi-system-reference /
// reference-system task 5). Consumes a harpia-generated Java project as a
// black box, like HarpiaTest/app_example/android_consumer:
//
//   (cd <gen>/java && gradle build -x test)      # the generated jar
//   gradle :cli:installDist -PharpiaGenDir=<gen>
//   cli/build/install/cli/bin/cli --station ... --sub ...
//   gradle :app:assembleDebug -PharpiaGenDir=<gen> -PwithAndroid   # the app
//
// The Android module is only included with -PwithAndroid, so building or
// running the JVM pieces never needs the Android Gradle Plugin / SDK.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // resolved only when app/ (i.e. -PwithAndroid) applies it
        id 'com.android.application' version '8.2.2'
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'harpia_ms_handheld'
include ':core', ':cli'
if (settings.hasProperty('withAndroid')) {
    include ':app'
}
