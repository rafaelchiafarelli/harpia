syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message patient_vitals {
int32 HARPIA_ID = 1;
string patient_id = 2;
float heart_rate = 3;
optional string device_note = 4;
string HARPIA_STATUS = 5;
string HARPIA_ERROR = 6;
string HARPIA_ORIGINATOR = 7;
}
