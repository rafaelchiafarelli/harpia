syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message queen {
int32 HARPIA_ID = 1;
int32 var = 2;
optional int32 val = 3;
map<string, string> a = 4;
map<string, int32> b = 5;
map<int32, string> c = 6;
int32 vari = 7;
string HARPIA_STATUS = 8;
string HARPIA_ERROR = 9;
string HARPIA_ORIGINATOR = 10;
}
