syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/vault_3ac5d8b36fc7dcfb70888145147ddfb7.proto";

message vault_Message {
    vault msg = 1;
}
//message for the standard functions 
message vault_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message vault_ID {
    int32 id = 1;
}
message vault_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service vault_Service {
    rpc heartBeat(vault_HeartBeat) returns (vault_HeartBeat) {}
    rpc streamSrc(vault_Stream ) returns (stream vault_Message) {}
    rpc pullByID(vault_ID) returns (vault_Message) {}
    rpc push(vault_Message) returns (errorCode) {}
}
