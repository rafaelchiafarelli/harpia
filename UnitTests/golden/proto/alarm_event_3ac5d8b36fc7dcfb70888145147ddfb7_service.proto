syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/alarm_event_3ac5d8b36fc7dcfb70888145147ddfb7.proto";

message alarm_event_Message {
    alarm_event msg = 1;
}
//message for the standard functions 
message alarm_event_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message alarm_event_ID {
    int32 id = 1;
}
message alarm_event_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service alarm_event_Service {
    rpc heartBeat(alarm_event_HeartBeat) returns (alarm_event_HeartBeat) {}
    rpc streamSrc(alarm_event_Stream ) returns (stream alarm_event_Message) {}
    rpc pullByID(alarm_event_ID) returns (alarm_event_Message) {}
    rpc push(alarm_event_Message) returns (errorCode) {}
}
