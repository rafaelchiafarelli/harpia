syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/bed_state_3ac5d8b36fc7dcfb70888145147ddfb7.proto";

message bed_state_Message {
    bed_state msg = 1;
}
//message for the standard functions 
message bed_state_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message bed_state_ID {
    int32 id = 1;
}
message bed_state_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service bed_state_Service {
    rpc heartBeat(bed_state_HeartBeat) returns (bed_state_HeartBeat) {}
    rpc streamSrc(bed_state_Stream ) returns (stream bed_state_Message) {}
    rpc pullByID(bed_state_ID) returns (bed_state_Message) {}
    rpc push(bed_state_Message) returns (errorCode) {}
}
