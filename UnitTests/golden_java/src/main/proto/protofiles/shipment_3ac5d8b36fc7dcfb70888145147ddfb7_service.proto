syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/shipment_3ac5d8b36fc7dcfb70888145147ddfb7.proto";

message shipment_Message {
    shipment msg = 1;
}
//message for the standard functions 
message shipment_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message shipment_ID {
    int32 id = 1;
}
message shipment_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service shipment_Service {
    rpc heartBeat(shipment_HeartBeat) returns (shipment_HeartBeat) {}
    rpc streamSrc(shipment_Stream ) returns (stream shipment_Message) {}
    rpc pullByID(shipment_ID) returns (shipment_Message) {}
    rpc push(shipment_Message) returns (errorCode) {}
}
