syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/pump_tick_3ac5d8b36fc7dcfb70888145147ddfb7.proto";

message pump_tick_Message {
    pump_tick msg = 1;
}
//message for the standard functions 
message pump_tick_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message pump_tick_ID {
    int32 id = 1;
}
message pump_tick_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service pump_tick_Service {
    rpc heartBeat(pump_tick_HeartBeat) returns (pump_tick_HeartBeat) {}
    rpc streamSrc(pump_tick_Stream ) returns (stream pump_tick_Message) {}
    rpc pullByID(pump_tick_ID) returns (pump_tick_Message) {}
    rpc push(pump_tick_Message) returns (errorCode) {}
}
