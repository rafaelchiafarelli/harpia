syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message lab_result {
int32 HARPIA_ID = 1;
string subject_ref = 2;
string analyte_code = 3;
int32 value_scaled = 4;
float reference_high = 5;
string HARPIA_STATUS = 6;
string HARPIA_ERROR = 7;
string HARPIA_ORIGINATOR = 8;
}
