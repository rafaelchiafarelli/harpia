syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/sensor_feed_3ac5d8b36fc7dcfb70888145147ddfb7.proto";

message sensor_feed_Message {
    sensor_feed msg = 1;
}
//message for the standard functions 
message sensor_feed_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message sensor_feed_ID {
    int32 id = 1;
}
message sensor_feed_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service sensor_feed_Service {
    rpc heartBeat(sensor_feed_HeartBeat) returns (sensor_feed_HeartBeat) {}
    rpc streamSrc(sensor_feed_Stream ) returns (stream sensor_feed_Message) {}
    rpc pullByID(sensor_feed_ID) returns (sensor_feed_Message) {}
    rpc push(sensor_feed_Message) returns (errorCode) {}
}
