# Generated by harpia (python target). Regenerated on every run; edit the
# .harpia schema, not this file.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harpia-generated"
version = "0.0.0"
description = "Python code generated by harpia from a .harpia schema"
requires-python = ">=3.10"
dependencies = [
    "protobuf>=4.21.12,<5",
    "grpcio>=1.51.1,<2",
]

[project.optional-dependencies]
zmq = ["pyzmq>=24.0.1,<27"]
postgres = ["psycopg>=3.1.17,<4"]
dds = ["cyclonedds==0.10.5"]

[tool.setuptools.packages.find]
include = ["harpia_runtime*", "harpia_generated*"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
