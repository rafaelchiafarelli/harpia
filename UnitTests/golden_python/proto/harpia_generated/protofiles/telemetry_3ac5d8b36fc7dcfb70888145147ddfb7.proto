syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/trace_row_3ac5d8b36fc7dcfb70888145147ddfb7.proto";
message telemetry {
int32 HARPIA_ID = 1;
string label = 2;
repeated int32 samples = 3;
repeated string notes = 4;
map<string, int32> gauges = 5;
map<int32, string> flags = 6;
repeated trace_row traces = 7;
string HARPIA_STATUS = 8;
string HARPIA_ERROR = 9;
string HARPIA_ORIGINATOR = 10;
}
