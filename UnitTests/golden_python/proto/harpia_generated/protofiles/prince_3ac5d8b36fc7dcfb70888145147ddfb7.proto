syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message prince {
int32 HARPIA_ID = 1;
int32 vari = 2;
int32 var = 3;
optional int32 val = 4;
map<string, string> a = 5;
map<string, int32> b = 6;
map<int32, string> c = 7;
repeated int32 scores = 8;
string HARPIA_STATUS = 9;
string HARPIA_ERROR = 10;
string HARPIA_ORIGINATOR = 11;
}
