// See README.md before touching this file. Pinned to Android Gradle Plugin
// 8.2.2 to match HarpiaTest/app_example/android_consumer. Consumes the harpia Java-target
// jar via -PharpiaGenDir, exactly as that example does.
plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.harpia.anesthesia'
    compileSdk 34

    defaultConfig {
        applicationId "com.harpia.anesthesia"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
        }
    }
}

def harpiaGenDir = project.findProperty('harpiaGenDir')
if (harpiaGenDir == null) {
    throw new GradleException(
        "Set -PharpiaGenDir=<path to a harpia-generated project> " +
        "(the folder main.py wrote with HARPIA_GEN_LANG=java, containing java/).")
}
def harpiaJavaDir = file("${harpiaGenDir}/java")

dependencies {
    // The harpia-generated project's own assembled jar: message classes, gRPC
    // stubs, and every Java-target adapter's runtime classes.
    implementation fileTree(dir: "${harpiaJavaDir}/build/libs", include: ["*.jar"])

    // Same pinned runtime deps the generated project declares. Full
    // protobuf-java runtime (not -javalite) so JsonFormat is available.
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    implementation 'com.google.protobuf:protobuf-java-util:3.25.3'

    implementation 'io.grpc:grpc-android:1.62.2'
    implementation 'io.grpc:grpc-okhttp:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'
    implementation 'io.grpc:grpc-protobuf:1.62.2'

    implementation 'org.zeromq:jeromq:0.6.0'
}

// Convenience: `gradle runDevice` / `gradle runHuman` build the generated jar's
// classpath and run the HumanMock entry point on the desktop JVM (the classes
// this module exercises are pure Java, no device needed).
tasks.register('printEntryPoint') {
    doLast { println 'entry point: com.harpia.anesthesia.HumanMock' }
}
