[pytest]
testpaths = UnitTests
# Golden snapshots are compared, never collected: golden_python/tests/ holds
# the generated project's own test_*.py, which only import inside that
# project (python-target / py-tests). Setting norecursedirs replaces pytest's
# defaults, so they are repeated here.
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} golden golden_java golden_python
# Don't write .pytest_cache into the (often mounted) working tree.
addopts = -p no:cacheprovider
markers =
    fuzz: bounded, deterministic parser fuzz runs (static-fuzz-ci epic); runs by default, `-m "not fuzz"` skips
