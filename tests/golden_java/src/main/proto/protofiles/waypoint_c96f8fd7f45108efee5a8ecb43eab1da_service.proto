syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/waypoint_c96f8fd7f45108efee5a8ecb43eab1da.proto";

message waypoint_Message {
    waypoint msg = 1;
}
//message for the standard functions 
message waypoint_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message waypoint_ID {
    int32 id = 1;
}
message waypoint_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service waypoint_Service {
    rpc heartBeat(waypoint_HeartBeat) returns (waypoint_HeartBeat) {}
    rpc streamSrc(waypoint_Stream ) returns (stream waypoint_Message) {}
    rpc pullByID(waypoint_ID) returns (waypoint_Message) {}
    rpc push(waypoint_Message) returns (errorCode) {}
}
