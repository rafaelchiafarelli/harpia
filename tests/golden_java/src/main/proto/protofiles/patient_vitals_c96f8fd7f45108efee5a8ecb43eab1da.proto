syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message patient_vitals {
int32 ID_c96f8fd7f45108efee5a8ecb43eab1da = 1;
string patient_id = 2;
float heart_rate = 3;
optional string device_note = 4;
string STATUS_c96f8fd7f45108efee5a8ecb43eab1da = 5;
string ERROR_c96f8fd7f45108efee5a8ecb43eab1da = 6;
string ORIGINATOR = 7;
}
