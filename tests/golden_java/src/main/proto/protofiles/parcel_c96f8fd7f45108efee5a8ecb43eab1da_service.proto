syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/parcel_c96f8fd7f45108efee5a8ecb43eab1da.proto";

message parcel_Message {
    parcel msg = 1;
}
//message for the standard functions 
message parcel_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message parcel_ID {
    int32 id = 1;
}
message parcel_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service parcel_Service {
    rpc heartBeat(parcel_HeartBeat) returns (parcel_HeartBeat) {}
    rpc streamSrc(parcel_Stream ) returns (stream parcel_Message) {}
    rpc pullByID(parcel_ID) returns (parcel_Message) {}
    rpc push(parcel_Message) returns (errorCode) {}
}
