syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/patient_vitals_c96f8fd7f45108efee5a8ecb43eab1da.proto";

message patient_vitals_Message {
    patient_vitals msg = 1;
}
//message for the standard functions 
message patient_vitals_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message patient_vitals_ID {
    int32 id = 1;
}
message patient_vitals_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service patient_vitals_Service {
    rpc heartBeat(patient_vitals_HeartBeat) returns (patient_vitals_HeartBeat) {}
    rpc streamSrc(patient_vitals_Stream ) returns (stream patient_vitals_Message) {}
    rpc pullByID(patient_vitals_ID) returns (patient_vitals_Message) {}
    rpc push(patient_vitals_Message) returns (errorCode) {}
}
