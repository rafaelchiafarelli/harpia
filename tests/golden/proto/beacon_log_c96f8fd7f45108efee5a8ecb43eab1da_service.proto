syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/beacon_log_c96f8fd7f45108efee5a8ecb43eab1da.proto";

message beacon_log_Message {
    beacon_log msg = 1;
}
//message for the standard functions 
message beacon_log_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message beacon_log_ID {
    int32 id = 1;
}
message beacon_log_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service beacon_log_Service {
    rpc heartBeat(beacon_log_HeartBeat) returns (beacon_log_HeartBeat) {}
    rpc streamSrc(beacon_log_Stream ) returns (stream beacon_log_Message) {}
    rpc pullByID(beacon_log_ID) returns (beacon_log_Message) {}
    rpc push(beacon_log_Message) returns (errorCode) {}
}
