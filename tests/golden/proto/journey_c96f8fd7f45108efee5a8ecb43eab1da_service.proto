syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/journey_c96f8fd7f45108efee5a8ecb43eab1da.proto";

message journey_Message {
    journey msg = 1;
}
//message for the standard functions 
message journey_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message journey_ID {
    int32 id = 1;
}
message journey_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service journey_Service {
    rpc heartBeat(journey_HeartBeat) returns (journey_HeartBeat) {}
    rpc streamSrc(journey_Stream ) returns (stream journey_Message) {}
    rpc pullByID(journey_ID) returns (journey_Message) {}
    rpc push(journey_Message) returns (errorCode) {}
}
