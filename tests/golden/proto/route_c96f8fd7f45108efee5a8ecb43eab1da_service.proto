syntax = "proto3";
package frameworkProtos;
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/route_c96f8fd7f45108efee5a8ecb43eab1da.proto";

message route_Message {
    route msg = 1;
}
//message for the standard functions 
message route_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message route_ID {
    int32 id = 1;
}
message route_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service route_Service {
    rpc heartBeat(route_HeartBeat) returns (route_HeartBeat) {}
    rpc streamSrc(route_Stream ) returns (stream route_Message) {}
    rpc pullByID(route_ID) returns (route_Message) {}
    rpc push(route_Message) returns (errorCode) {}
}
